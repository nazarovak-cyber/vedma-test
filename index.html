<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Какая скрытая сила живёт в вас? — тест по книге «Я ведьма»</title>

<style>
:root{
  --night:#170f14; --dark:#21131b; --wine:#542438; --wine2:#7a3350;
  --gold:#d1b478; --gold2:#ecd9a8; --paper:#f8f5ee; --cream:#eee7dc;
  --muted:#b8a8ae; --line:rgba(209,180,120,.25);
  --serif:Cormorant,Georgia,"Times New Roman",serif; --sans:Manrope,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--cream);background:var(--night);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:radial-gradient(1200px 700px at 80% -10%,rgba(122,51,80,.55),transparent 60%),
             radial-gradient(900px 600px at -10% 40%,rgba(84,36,56,.6),transparent 60%),
             radial-gradient(800px 500px at 50% 110%,rgba(209,180,120,.12),transparent 60%),var(--night)}
.stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--gold2);opacity:.0;animation:tw 5s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:0}50%{opacity:.8}}
a{color:inherit}
.wrap{width:min(1080px,calc(100% - 40px));margin:0 auto}
.narrow{width:min(720px,calc(100% - 40px));margin:0 auto}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.08;color:var(--paper)}
h1{font-size:clamp(40px,8vw,76px);letter-spacing:-.01em}
h2{font-size:clamp(32px,5.5vw,52px)}
h3{font-size:clamp(24px,3.5vw,30px)}
em,.gold{color:var(--gold);font-style:italic}
.eyebrow{display:inline-flex;gap:10px;align-items:center;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.eyebrow::before{content:"✦"}
.lead{font-size:clamp(17px,2.2vw,20px);color:var(--cream);opacity:.92}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;text-decoration:none;font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.02em;
  padding:20px 34px;border-radius:999px;color:#2a1720;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#b8955a);
  box-shadow:0 10px 40px rgba(209,180,120,.35),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 50px rgba(209,180,120,.5)}
.btn.pulse{animation:pulse 2.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 10px 40px rgba(209,180,120,.35),0 0 0 0 rgba(209,180,120,.45)}50%{box-shadow:0 10px 40px rgba(209,180,120,.35),0 0 0 14px rgba(209,180,120,0)}}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line);box-shadow:none}
.note{font-size:13px;color:var(--muted)}
section{padding:72px 0}
.screen{display:none}
.screen.active{display:block;animation:fade .6s ease}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{font-family:var(--serif);font-size:22px;letter-spacing:.08em;text-decoration:none;color:var(--paper)}
.logo small{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}

/* hero */
.hero{padding:30px 0 60px;text-align:center}
.hero h1{margin:22px auto 22px;max-width:14ch}
.hero .lead{max-width:600px;margin:0 auto 34px}
.hero .meta{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:18px}
.hero .meta span{font-size:14px;color:var(--muted)}
.hero .meta span::before{content:"☾ ";color:var(--gold)}
.orb{width:min(300px,70vw);aspect-ratio:1;margin:0 auto 10px;position:relative}
.orb svg{width:100%;height:100%;animation:spin 60s linear infinite}
.orb .eye{position:absolute;inset:0;display:grid;place-items:center;font-size:54px;color:var(--gold);animation:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* signs */
.signs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:34px}
.sign{padding:22px;border:1px solid var(--line);border-radius:18px;background:rgba(33,19,27,.55);backdrop-filter:blur(4px)}
.sign b{display:block;font-family:var(--serif);font-size:22px;color:var(--paper);margin-bottom:6px;font-weight:600}
.sign .ico{font-size:22px;color:var(--gold)}

/* shadow block */
.warn{border:1px solid rgba(209,180,120,.35);border-radius:26px;padding:clamp(28px,5vw,52px);
  background:linear-gradient(160deg,rgba(84,36,56,.55),rgba(23,15,20,.8))}
.warn ul{list-style:none;margin:22px 0 0;display:grid;gap:12px}
.warn li{padding-left:30px;position:relative}
.warn li::before{content:"✕";position:absolute;left:0;color:var(--gold);font-size:14px;top:3px}

/* archetype preview */
.arch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:34px}
.arch{border:1px solid var(--line);border-radius:18px;padding:24px 18px;text-align:center;background:rgba(33,19,27,.5);transition:transform .25s,border-color .25s}
.arch:hover{transform:translateY(-4px);border-color:var(--gold)}
.arch svg{width:54px;height:54px;margin-bottom:10px}
.arch b{display:block;font-family:var(--serif);font-size:22px;color:var(--paper);font-weight:600}
.arch span{font-size:14px;color:var(--muted)}

/* what you get */
.get{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:30px;counter-reset:g}
.get div{counter-increment:g;padding-top:14px;border-top:1px solid var(--line)}
.get div::before{content:"0" counter(g);font-family:var(--serif);font-size:34px;color:var(--gold);display:block}
.cta-final{text-align:center;padding:80px 0 50px}

/* quiz */
#quiz{min-height:100vh;min-height:100dvh;padding-bottom:40px}
.qbar{display:flex;justify-content:space-between;align-items:center;padding:22px 0 10px;font-size:14px;color:var(--muted)}
.qback{background:none;border:0;color:var(--gold);font:inherit;cursor:pointer;padding:6px 0}
.qback[disabled]{opacity:.3;cursor:default}
.progress{height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--wine2),var(--gold));transition:width .5s ease}
.qcard{margin-top:clamp(30px,6vh,60px)}
.qnum{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:20px}
.qtext{font-size:clamp(28px,5vw,42px);margin:8px 0 28px}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:18px 20px;border-radius:16px;cursor:pointer;
  border:1px solid var(--line);background:rgba(33,19,27,.6);color:var(--cream);font:inherit;font-size:16px;line-height:1.45;transition:all .2s}
.opt:hover{border-color:var(--gold);background:rgba(84,36,56,.5)}
.opt.sel{border-color:var(--gold);background:rgba(209,180,120,.16)}
.opt .dot{flex:0 0 22px;height:22px;border-radius:50%;border:1px solid var(--gold);margin-top:1px;display:grid;place-items:center}
.opt.sel .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold)}
.qanim{animation:fade .45s ease}

/* loading */
#loading{min-height:100vh;min-height:100dvh;display:none;place-items:center;text-align:center}
#loading.active{display:grid}
.cards-fan{position:relative;width:200px;height:200px;margin:0 auto 30px}
.cards-fan span{position:absolute;left:70px;top:20px;width:64px;height:110px;border-radius:8px;border:1px solid var(--gold);
  background:linear-gradient(160deg,var(--wine),var(--dark));transform-origin:50% 140%;animation:fan 2.4s ease-in-out infinite}
.cards-fan span::after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:var(--gold)}
.cards-fan span:nth-child(1){--r:-30deg}.cards-fan span:nth-child(2){--r:-10deg}.cards-fan span:nth-child(3){--r:10deg}.cards-fan span:nth-child(4){--r:30deg}
@keyframes fan{0%,100%{transform:rotate(0)}50%{transform:rotate(var(--r))}}
#loadText{font-family:var(--serif);font-size:26px;font-style:italic;color:var(--paper);min-height:1.4em}

/* result */
.res-head{text-align:center;padding:30px 0 10px}
.tarot{width:min(300px,78vw);margin:30px auto;aspect-ratio:3/5;border-radius:20px;padding:12px;
  background:linear-gradient(160deg,var(--gold2),var(--gold) 40%,#8e6e3a);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(209,180,120,.25);
  animation:reveal 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes reveal{from{transform:rotateY(90deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
.tarot-in{height:100%;border-radius:12px;background:radial-gradient(circle at 50% 35%,var(--wine2),var(--dark) 70%);
  border:1px solid rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 14px;text-align:center}
.tarot-in .roman{font-family:var(--serif);color:var(--gold);letter-spacing:.3em;font-size:16px}
.tarot-in svg{width:58%;height:auto}
.tarot-in .tname{font-family:var(--serif);font-size:30px;color:var(--paper);line-height:1}
.tarot-in .tsub{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}
.block{margin:26px 0;padding:clamp(24px,4vw,40px);border-radius:24px;border:1px solid var(--line);background:rgba(33,19,27,.6)}
.block h3{margin-bottom:14px}
.block p+p{margin-top:12px}
.block ul{list-style:none;display:grid;gap:10px;margin-top:6px}
.block li{padding-left:26px;position:relative}
.block li::before{content:"✦";position:absolute;left:0;color:var(--gold);font-size:13px;top:3px}
.block.shadow{background:linear-gradient(160deg,rgba(23,15,20,.9),rgba(84,36,56,.45))}
.block.shadow li::before{content:"✕"}
.bars{display:grid;gap:14px;margin-top:10px}
.bar-row{display:grid;grid-template-columns:150px 1fr 44px;gap:12px;align-items:center;font-size:15px}
.bar{height:10px;border-radius:10px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,var(--wine2),var(--gold));transition:width 1.4s ease}
.bar-row.lead-row{color:var(--paper);font-weight:700}
.level{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{--p:50;width:120px;height:120px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.08) 0)}
.ring b{width:96px;height:96px;border-radius:50%;background:var(--dark);display:grid;place-items:center;font-family:var(--serif);font-size:34px;color:var(--paper)}
.level .lt{flex:1;min-width:220px}
.level .lt strong{font-family:var(--serif);font-size:26px;color:var(--gold);font-weight:600;display:block;line-height:1.1;margin-bottom:6px}
.practice{display:grid;gap:14px;margin-top:8px}
.practice div{padding:18px;border-radius:16px;background:rgba(84,36,56,.35);border:1px solid rgba(209,180,120,.15)}
.practice b{display:block;color:var(--paper);margin-bottom:4px}
.practice small{color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-size:11px}

/* offer */
.offer{margin:46px 0 20px;border-radius:28px;padding:3px;background:linear-gradient(135deg,var(--gold2),var(--wine2) 50%,var(--gold))}
.offer-in{border-radius:25px;background:linear-gradient(170deg,#2b1823,var(--night));padding:clamp(26px,5vw,48px);display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:clamp(20px,4vw,40px);align-items:center}
.cover{width:100%;aspect-ratio:2/3;border-radius:6px 12px 12px 6px;object-fit:cover;box-shadow:-8px 18px 50px rgba(0,0,0,.7);transform:rotate(-3deg);background:linear-gradient(160deg,var(--wine),var(--dark))}
.cover-fallback{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:16px;border:1px solid var(--gold)}
.cover-fallback b{font-family:var(--serif);font-size:30px;color:var(--paper);line-height:1}
.cover-fallback span{font-size:11px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-top:8px}
.price{display:flex;align-items:baseline;gap:16px;margin:18px 0 6px;flex-wrap:wrap}
.price b{font-family:var(--serif);font-size:60px;color:var(--gold2);line-height:1}
.price s{font-size:22px;color:var(--muted)}
.price .tag{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--wine2);color:var(--paper);padding:6px 10px;border-radius:999px}
.offer ul{list-style:none;display:grid;gap:8px;margin:16px 0 24px}
.offer li::before{content:"✓  ";color:var(--gold);font-weight:700}
.offer .btn{width:100%}
.offer .alt{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:14px}
.offer .alt a{color:var(--gold)}
.quote{font-family:var(--serif);font-style:italic;font-size:clamp(22px,3vw,28px);color:var(--paper);text-align:center;max-width:620px;margin:40px auto}
.share{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:30px 0}
footer{padding:40px 0 60px;text-align:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:40px}
footer a{color:var(--gold)}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(23,15,20,.98),rgba(23,15,20,.85));
  border-top:1px solid var(--line);display:none;z-index:20;transform:translateY(110%);transition:transform .35s}
.sticky.show{transform:none}
.sticky .btn{width:100%;padding:16px;font-size:16px}
@media (max-width:640px){
  section{padding:54px 0}
  .offer-in{grid-template-columns:1fr;text-align:center}
  .cover{width:62%;margin:0 auto}
  .price{justify-content:center}
  .offer ul{text-align:left}
  .bar-row{grid-template-columns:118px 1fr 38px;font-size:14px}
  .sticky{display:block}
  .hero .btn{width:100%}
}
.langbar{position:fixed;top:14px;right:14px;z-index:30;display:flex;gap:2px;padding:4px;border-radius:999px;
  background:rgba(23,15,20,.78);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.langbar button{border:0;background:transparent;color:var(--muted);font:600 12px/1 var(--sans);letter-spacing:.08em;padding:8px 10px;border-radius:999px;cursor:pointer;transition:all .2s}
.langbar button:hover{color:var(--paper)}
.langbar button.on{background:var(--gold);color:#2a1720}
.top{padding-right:190px}
@media (max-width:640px){.langbar{top:10px;right:10px}.langbar button{padding:7px 8px;font-size:11px}.top{padding-right:0;padding-top:58px}}
#quiz .qbar{padding-top:64px}
.res-head{padding-top:64px}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="langbar" id="langbar" role="group" aria-label="Language">
  <button data-lang="ru">RU</button><button data-lang="en">EN</button><button data-lang="pt">PT</button><button data-lang="es">ES</button>
</div>

<div id="landing" class="screen active"></div>

<div id="quiz" class="screen">
  <div class="narrow">
    <div class="qbar"><button class="qback" id="qBack"></button><span id="qCount">1 / 10</span></div>
    <div class="progress"><i id="qProg"></i></div>
    <div class="qcard" id="qCard"></div>

</div>

<div id="loading" class="screen">
  <div>
    <div class="cards-fan"><span></span><span></span><span></span><span></span></div>

</div>

<div id="result" class="screen">
  <div class="narrow" id="resBody"></div>
  <footer class="narrow" id="footer"></footer>
</div>

<div class="sticky" id="sticky"><a class="btn" id="stickyBtn" href="#"></a></div>

<script>
/* ================= НАСТРОЙКИ ================= */

const YM_ID = null; // номер счётчика Яндекс.Метрики, если нужен

const ICONS = {
 seer:`<svg viewBox="0 0 100 100" fill="none" stroke="#d1b478" stroke-width="2.2"><path d="M8 50 Q50 12 92 50 Q50 88 8 50Z"/><circle cx="50" cy="50" r="15"/><circle cx="50" cy="50" r="5" fill="#d1b478"/><path d="M50 8v10M50 82v10M20 22l6 7M80 22l-6 7M20 78l6-7M80 78l-6-7" opacity=".6"/></svg>`,

};


/* ================= РУССКИЕ ТЕКСТЫ: архетипы, вопросы, уровни ================= */
const A = {
 seer:{ gen:"Видящей", name:"Видящая", roman:"I", sub:"дар ясновидения", short:"интуиция и предчувствия",
  essence:"Ваша сила — знание без объяснений. Вы видите суть людей и событий раньше, чем она становится очевидной. Информация приходит к вам вспышками: образом, ощущением в теле, внезапной уверенностью. Вы часто правы, но редко можете доказать, откуда знаете.",

/* ================= СБОРКА ЯЗЫКОВ ================= */
const T = { ru:{A, Q, L:LEVELS} };
[["en",A_EN],["pt",A_PT],["es",A_ES]].forEach(([l,aa])=>{
  T[l] = {
    A: aa,
    Q: Q_TXT[l].map((x,i)=>({q:x[0], lvl:Q[i].lvl, o:x[1].map((t,j)=>[t, Q[i].o[j][1]])})),
    L: LEVELS.map((lv,i)=>Object.assign({}, lv, {name:LEVELS_TXT[l][i][0], text:LEVELS_TXT[l][i][1]}))
  };
});
const LANGS = ["ru","en","pt","es"];
function detectLang(){
  const p = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(p)) return p;
  try{ const s = localStorage.getItem('vb_lang'); if (LANGS.includes(s)) return s; }catch(e){}
  const n = (navigator.language||'ru').slice(0,2).toLowerCase();
  if (["ru","uk","be","kk"].includes(n)) return "ru";
  return LANGS.includes(n) ? n : "en";
}
let lang = detectLang();
const t = () => UI[lang];
const D = () => T[lang];

/* ================= ЛОГИКА ================= */
let step=0, current='landing', lastResult=null; const answers=[];
const $=s=>document.querySelector(s);
function show(id){current=id;document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$('#'+id).classList.add('active');window.scrollTo({top:0,behavior:'instant'}); if(id!=='result') $('#sticky').classList.remove('show');}

(()=>{const s=$('#stars');for(let i=0;i<60;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.top=Math.random()*100+'%';e.style.animationDelay=(Math.random()*5)+'s';e.style.animationDuration=(3+Math.random()*5)+'s';s.appendChild(e);}})();

function setLang(l, rerender=true){
  lang=l; try{localStorage.setItem('vb_lang',l);}catch(e){}
  document.documentElement.lang=l;
  document.title=t().metaTitle;
  const md=document.querySelector('meta[name=description]'); if(md) md.content=t().metaDesc;
  document.querySelectorAll('#langbar button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  $('#qBack').textContent=t().qBack;
  renderLanding();
  if(!rerender) return;
  if(current==='quiz') renderQ();
  if(current==='result' && lastResult) renderResult(true);
}
document.querySelectorAll('#langbar button').forEach(b=>b.onclick=()=>{ if(b.dataset.lang!==lang){ track('lang_'+b.dataset.lang); setLang(b.dataset.lang); } });

$('#qBack').onclick=()=>{ if(step>0){step--;renderQ();} };

function renderQ(){
  const Q=D().Q, item=Q[step];
  $('#qCount').textContent=`${step+1} / ${Q.length}`;
  $('#qProg').style.width=((step)/Q.length*100)+'%';
  $('#qBack').disabled=step===0;
  $('#qCard').innerHTML=`<div class="qanim"><div class="qnum">${t().qNum(step+1)}</div><h2 class="qtext">${item.q}</h2>
   <div class="opts">${item.o.map((o,i)=>`<button class="opt${answers[step]===i?' sel':''}" data-i="${i}"><span class="dot"></span><span>${o[0]}</span></button>`).join('')}</div>
   <p class="note" style="margin-top:18px">${t().qHint}</p></div>`;
  $('#qCard').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    answers[step]=+b.dataset.i; b.classList.add('sel');
    setTimeout(()=>{ step++; if(step<Q.length) renderQ(); else finish(); },280);
  });
}

function finish(){
  $('#qProg').style.width='100%'; track('quiz_complete');
  show('loading');
  let i=0; $('#loadText').textContent=t().load[0];
  const iv=setInterval(()=>{i++; if(i<4) $('#loadText').textContent=t().load[i];},800);
  setTimeout(()=>{clearInterval(iv);lastResult=calc();renderResult(false);},3300);
}

function calc(){
  const ORDER=["seer","dreamer","healer","queen","keeper"];
  const sc={seer:0,dreamer:0,healer:0,queen:0,keeper:0}; let lvl=0;
  Q.forEach((item,qi)=>{const a=answers[qi]; if(a==null)return; const v=item.o[a][1];
    if(item.lvl) lvl+=v; else for(const k in v) sc[k]+=v[k];});
  const ranked=ORDER.slice().sort((a,b)=>sc[b]-sc[a]);
  const max=Math.max(...Object.values(sc))||1;
  const li=LEVELS.findIndex(l=>lvl>=l.min&&lvl<=l.max);
  const L=LEVELS[li];
  const pct=Math.round(L.pct[0]+(sc[ranked[0]]%5)/4*(L.pct[1]-L.pct[0]));
  return {sc,ranked,max,li,pct};
}
